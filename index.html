<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Hub Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff; --secondary: #00ff88; --danger: #ff003c;
            --dark-bg: #05070a; --panel: #0f121a; --btn-num: #1c212d;
            --btn-sci: #252d3d; --accent: #ff00ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark-bg); height: 100vh; display: flex; flex-direction: column; color: #fff; overflow: hidden; }
        header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #0a0d14; border-bottom: 2px solid var(--primary); }
        .logo { font-family: 'Orbitron'; color: var(--primary); font-size: 18px; text-shadow: 0 0 10px var(--primary); }
        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; overflow-y: auto; }
        
        /* Calculator */
        .calc-container { width: 100%; max-width: 420px; background: var(--panel); padding: 15px; border-radius: 25px; border: 1px solid #333; }
        .screen { background: #000; border-radius: 18px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--primary); text-align: left; direction: ltr; }
        #display-val { font-family: 'Orbitron'; font-size: 28px; color: #fff; min-height: 40px; overflow-x: auto; }
        #display-step { font-size: 12px; color: var(--primary); opacity: 0.6; height: 18px; }
        .calc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .btn { height: 50px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        .btn-num { background: var(--btn-num); }
        .btn-op { background: #161b22; color: var(--secondary); }
        .btn-sci { background: var(--btn-sci); color: var(--primary); }
        .btn-mode { background: #2a1a3d; color: var(--accent); font-size: 10px; }
        .btn-eq { background: linear-gradient(135deg, var(--primary), #0066ff); grid-column: span 2; }

        /* Navigation */
        .bottom-bar { background: #0a0d14; padding: 8px; display: flex; justify-content: space-around; border-top: 1px solid #222; }
        .quick-btn { background: none; border: none; color: #888; font-size: 10px; display: flex; flex-direction: column; align-items: center; flex: 1; cursor: pointer; }
        .quick-btn span:first-child { font-size: 20px; }
        .quick-btn.active { color: var(--primary); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: var(--panel); width: 95%; max-width: 500px; border-radius: 20px; border: 1px solid var(--primary); padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }

        /* Drawing Pad Tools */
        .draw-tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .tool-btn { width: 35px; height: 35px; border-radius: 5px; border: 1px solid #444; cursor: pointer; }

        /* Games */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-card { background: #1a1f2b; padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #333; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #1a1f2b; border: 1px solid var(--primary); color: #fff; border-radius: 8px; }
        
        /* Unit Converter */
        .unit-box { background: #161b22; padding: 15px; border-radius: 15px; margin-top: 10px; }

        footer { display: flex; justify-content: center; gap: 20px; background: #0a0d14; padding: 10px; border-top: 2px solid var(--accent); }
        .mode-indicator { font-family: 'Orbitron'; color: var(--accent); font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">QUANTUM HUB</div>
    <select id="lang-select" onchange="changeLang(this.value)" style="width: 80px; margin:0;">
        <option value="ar">العربية</option>
        <option value="en">English</option>
    </select>
</header>

<main class="main-content">
    <div class="calc-container">
        <div class="screen">
            <div id="display-step"></div>
            <div id="display-val">0</div>
        </div>
        <div class="calc-grid">
            <button class="btn btn-sci" onclick="ins('Math.PI')">π</button>
            <button class="btn btn-sci" onclick="ins('Math.E')">e</button>
            <button class="btn btn-mode" id="angle-mode" onclick="toggleAngle()">DEG</button>
            <button class="btn btn-op" onclick="clr()">AC</button>
            <button class="btn btn-op" onclick="del()">DEL</button>

            <button class="btn btn-sci" onclick="sci('sin')">sin</button>
            <button class="btn btn-sci" onclick="sci('cos')">cos</button>
            <button class="btn btn-sci" onclick="sci('tan')">tan</button>
            <button class="btn btn-sci" onclick="ins('Math.log10(')">log</button>
            <button class="btn btn-sci" onclick="ins('Math.log(')">ln</button>

            <button class="btn btn-sci" onclick="ins('**2')">x²</button>
            <button class="btn btn-sci" onclick="ins('**')">xʸ</button>
            <button class="btn btn-sci" onclick="ins('Math.sqrt(')">√</button>
            <button class="btn btn-sci" onclick="ins('Math.exp(')">eˣ</button>
            <button class="btn btn-op" onclick="ins('/')">÷</button>

            <button class="btn btn-num" onclick="ins('7')">7</button>
            <button class="btn btn-num" onclick="ins('8')">8</button>
            <button class="btn btn-num" onclick="ins('9')">9</button>
            <button class="btn btn-op" onclick="ins('*')">×</button>
            <button class="btn btn-sci" onclick="fact()">x!</button>

            <button class="btn btn-num" onclick="ins('4')">4</button>
            <button class="btn btn-num" onclick="ins('5')">5</button>
            <button class="btn btn-num" onclick="ins('6')">6</button>
            <button class="btn btn-op" onclick="ins('-')">−</button>
            <button class="btn btn-sci" onclick="ins('%')">mod</button>

            <button class="btn btn-num" onclick="ins('1')">1</button>
            <button class="btn btn-num" onclick="ins('2')">2</button>
            <button class="btn btn-num" onclick="ins('3')">3</button>
            <button class="btn btn-op" onclick="ins('+')">+</button>
            <button class="btn btn-sci" onclick="ins('(')">(</button>

            <button class="btn btn-num" onclick="ins('0')">0</button>
            <button class="btn btn-num" onclick="ins('.')">.</button>
            <button class="btn btn-sci" onclick="ins(')')">)</button>
            <button class="btn btn-eq" onclick="calculate()">=</button>
        </div>
    </div>
</main>

<footer>
    <div class="mode-indicator">SYSTEM READY</div>
    <div class="mode-indicator" id="footer-angle">DEGREE MODE</div>
</footer>

<div class="bottom-bar">
    <button class="quick-btn" onclick="openModal('units-modal')"><span>⚖️</span><span data-key="nav_units">محول</span></button>
    <button class="quick-btn" onclick="openModal('game-modal')"><span>🎮</span><span data-key="nav_games">ألعاب</span></button>
    <button class="quick-btn" onclick="openModal('draw-modal')"><span>🎨</span><span data-key="nav_draw">رسم</span></button>
    <button class="quick-btn" onclick="openModal('timer-modal')"><span>⏱️</span><span data-key="nav_timer">مؤقت</span></button>
    <button class="quick-btn" onclick="openModal('bmi-modal')"><span>💪</span><span data-key="nav_health">صحتي</span></button>
</div>

<div id="draw-modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('draw-modal')">✕</button>
        <h3 style="text-align:center; color:var(--primary)">لوحة الرسم المتطورة</h3>
        <div class="draw-tools">
            <input type="color" id="pen-color" class="tool-btn" value="#00f2ff">
            <button class="btn btn-sci" style="width:40px" onclick="setEraser()">🧽</button>
            <button class="btn btn-sci" style="width:40px" onclick="setPen()">✏️</button>
            <input type="range" id="pen-width" min="1" max="20" value="5" style="width:80px">
        </div>
        <canvas id="d-cvs" style="background:#fff; border-radius:10px; width:100%; height:300px; touch-action:none;"></canvas>
        <button class="btn btn-del" style="width:100%; margin-top:10px; background:var(--danger)" onclick="clearCanvas()">مسح الكل</button>
    </div>
</div>

<div id="game-modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('game-modal')">✕</button>
        <div id="game-menu" class="game-grid">
            <div class="game-card" onclick="startTTT()">❌<p>XO</p></div>
            <div class="game-card" onclick="startSnake()">🐍<p>الثعبان</p></div>
            <div class="game-card" onclick="startMemory()">🧠<p>ذاكرة</p></div>
            <div class="game-card" onclick="startMath()">➕<p>تحدي</p></div>
            <div class="game-card" onclick="startRPS()">✊<p>RPS</p></div>
            <div class="game-card" onclick="startClick()">⚡<p>سرعة</p></div>
        </div>
        <div id="play-area" style="display:none; text-align:center;">
            <div id="game-container"></div>
            <button class="btn btn-op" style="width:100%; margin-top:15px" onclick="backToMenu()">رجوع</button>
        </div>
    </div>
</div>

<div id="timer-modal" class="modal">
    <div class="modal-content" style="text-align:center;">
        <button class="close-btn" onclick="closeModal('timer-modal')">✕</button>
        <h3 data-key="nav_timer">المؤقت</h3>
        <div id="t-disp" style="font-size:60px; font-family:'Orbitron'; color:var(--primary); margin:20px 0;">00:00</div>
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <input type="number" id="t-min" placeholder="دقائق" min="0" value="5">
            <input type="number" id="t-sec" placeholder="ثواني" min="0" max="59" value="0">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-eq" style="flex:1" onclick="startT()">ابدأ</button>
            <button class="btn btn-del" style="flex:1; background:var(--danger)" onclick="resetT()">إعادة</button>
        </div>
    </div>
</div>

<div id="units-modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('units-modal')">✕</button>
        <h3>محول الوحدات الذكي</h3>
        <div class="unit-box">
            <label>من كيلومتر إلى متر</label>
            <input type="number" id="km-in" oninput="convertUnits('km')" placeholder="أدخل كم">
            <div id="m-out" style="color:var(--secondary); margin-top:5px;">النتيجة: 0 متر</div>
        </div>
        <div class="unit-box">
            <label>من دولار إلى ريال (تقديري)</label>
            <input type="number" id="usd-in" oninput="convertUnits('usd')" placeholder="أدخل $">
            <div id="sar-out" style="color:var(--secondary); margin-top:5px;">النتيجة: 0 ريال</div>
        </div>
    </div>
</div>

<div id="bmi-modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('bmi-modal')">✕</button>
        <h3>حاسبة مؤشر الكتلة</h3>
        <input type="number" id="bw" placeholder="الوزن (كجم)">
        <input type="number" id="bh" placeholder="الطول (سم)">
        <button class="btn btn-eq" style="width:100%;" onclick="calcB()">احسب</button>
        <div id="br" style="text-align:center; margin-top:15px; font-size:20px;"></div>
    </div>
</div>

<script>
    // --- Global Logic ---
    let angleMode = 'DEG';
    let expr = "";
    const dVal = document.getElementById('display-val');
    const dStep = document.getElementById('display-step');

    function toggleAngle() {
        angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
        document.getElementById('angle-mode').innerText = angleMode;
        document.getElementById('footer-angle').innerText = angleMode + " MODE";
    }

    function ins(v) { if(dVal.innerText==="0" && !isNaN(v)) expr=""; expr += v; updateUI(); }
    function clr() { expr = ""; dVal.innerText = "0"; dStep.innerText = ""; }
    function del() { expr = expr.slice(0,-1); updateUI(); if(!expr) dVal.innerText="0"; }
    function updateUI() { dVal.innerText = expr.replace(/Math\./g, '').replace(/\*\*/g, '^'); }

    function sci(fn) {
        if(angleMode === 'DEG') {
            ins(`Math.${fn}((Math.PI/180)*`);
        } else {
            ins(`Math.${fn}(`);
        }
    }

    function calculate() {
        try {
            // Auto-close brackets
            let openBrackets = (expr.match(/\(/g) || []).length;
            let closeBrackets = (expr.match(/\)/g) || []).length;
            for(let i=0; i < openBrackets - closeBrackets; i++) expr += ")";
            
            let res = eval(expr);
            dStep.innerText = dVal.innerText + " =";
            expr = res.toString();
            dVal.innerText = res;
        } catch(e) { alert("خطأ في العملية"); clr(); }
    }

    function fact() {
        let n = parseInt(eval(expr));
        let r = 1; for(let i=1; i<=n; i++) r *= i;
        expr = r.toString(); updateUI();
    }

    // --- Drawing Pad ---
    const dcvs = document.getElementById('d-cvs'), dctx = dcvs.getContext('2d');
    let drawing = false, isEraser = false;

    function initDraw() {
        dcvs.width = dcvs.offsetWidth; dcvs.height = 300;
        dctx.lineCap = 'round'; dctx.lineJoin = 'round';
        
        const start = (e) => {
            drawing = true; dctx.beginPath();
            const r = dcvs.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            dctx.moveTo(x, y);
        };
        const move = (e) => {
            if(!drawing) return;
            const r = dcvs.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            dctx.strokeStyle = isEraser ? '#ffffff' : document.getElementById('pen-color').value;
            dctx.lineWidth = document.getElementById('pen-width').value;
            dctx.lineTo(x, y); dctx.stroke();
            if(e.touches) e.preventDefault();
        };
        dcvs.onmousedown = dcvs.ontouchstart = start;
        dcvs.onmousemove = dcvs.ontouchmove = move;
        window.onmouseup = window.ontouchend = () => drawing = false;
    }
    function setEraser() { isEraser = true; }
    function setPen() { isEraser = false; }
    function clearCanvas() { dctx.clearRect(0,0,dcvs.width,dcvs.height); }

    // --- Games ---
    function openModal(id) { 
        document.querySelectorAll('.modal').forEach(m => m.style.display='none');
        document.getElementById(id).style.display='flex';
        if(id==='draw-modal') setTimeout(initDraw, 200);
    }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function backToMenu() { document.getElementById('game-menu').style.display='grid'; document.getElementById('play-area').style.display='none'; clearInterval(gameInt); }

    let gameInt;
    function startSnake() {
        document.getElementById('game-menu').style.display='none';
        document.getElementById('play-area').style.display='block';
        const cont = document.getElementById('game-container');
        cont.innerHTML = '<canvas id="s-cvs" width="280" height="280" style="background:#000; border:1px solid var(--primary)"></canvas>';
        const scvs = document.getElementById('s-cvs'), sctx = scvs.getContext('2d');
        let snake = [{x:10, y:10}], food = {x:15, y:15}, dx=1, dy=0, size=20, box=14;
        
        gameInt = setInterval(() => {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x < 0 || head.x >= size || head.y < 0 || head.y >= size) return backToMenu();
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) food = {x: Math.floor(Math.random()*size), y: Math.floor(Math.random()*size)};
            else snake.pop();
            
            sctx.fillStyle='#000'; sctx.fillRect(0,0,280,280);
            sctx.fillStyle='red'; sctx.fillRect(food.x*box, food.y*box, box, box);
            sctx.fillStyle='#00ff88'; snake.forEach(s => sctx.fillRect(s.x*box, s.y*box, box, box));
        }, 150);

        window.onkeydown = (e) => {
            if(e.key==='ArrowUp' && dy===0){dx=0; dy=-1;}
            if(e.key==='ArrowDown' && dy===0){dx=0; dy=1;}
            if(e.key==='ArrowLeft' && dx===0){dx=-1; dy=0;}
            if(e.key==='ArrowRight' && dx===0){dx=1; dy=0;}
        };
    }

    // --- Utilities ---
    let tTimer;
    function startT() {
        clearInterval(tTimer);
        let m = parseInt(document.getElementById('t-min').value) || 0;
        let s = parseInt(document.getElementById('t-sec').value) || 0;
        let total = m * 60 + s;
        tTimer = setInterval(() => {
            if(total <= 0) { clearInterval(tTimer); alert("انتهى الوقت!"); return; }
            total--;
            let dm = Math.floor(total/60).toString().padStart(2,'0');
            let ds = (total%60).toString().padStart(2,'0');
            document.getElementById('t-disp').innerText = `${dm}:${ds}`;
        }, 1000);
    }
    function resetT() { clearInterval(tTimer); document.getElementById('t-disp').innerText="00:00"; }

    function convertUnits(type) {
        if(type === 'km') {
            let val = document.getElementById('km-in').value;
            document.getElementById('m-out').innerText = `النتيجة: ${val * 1000} متر`;
        } else {
            let val = document.getElementById('usd-in').value;
            document.getElementById('sar-out').innerText = `النتيجة: ${val * 3.75} ريال`;
        }
    }

    function calcB() {
        let w = document.getElementById('bw').value, h = document.getElementById('bh').value/100;
        let res = (w/(h*h)).toFixed(1);
        document.getElementById('br').innerText = "BMI: " + res;
    }

    function changeLang(l) {
        const ar = l === 'ar';
        document.body.dir = ar ? 'rtl' : 'ltr';
        // Add more translation logic if needed
    }
</script>

</body>
</html>
